[package]
name = "syncclipboard-win-rs"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight Windows client for SyncClipboard"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls", "stream"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = false
